name: Bug
description: Something in the app does not work.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Skywall version
      description: Settings shows it under the app name.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Pro 14-inch, 2024
  - type: dropdown
    id: displays
    attributes:
      label: Displays
      options:
        - One
        - Two
        - Three or more
  - type: input
    id: film
    attributes:
      label: Which film
      description: If it happens with one film and not others.
